services:
  postgres:
    image: postgres:16
    container_name: catalog_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog123
      POSTGRES_DB: catalogdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: catalog_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata: